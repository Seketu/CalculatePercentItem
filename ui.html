<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .error-message {
      background: #fed7d7;
      color: #c53030;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      border: 2px solid #fc8181;
    }

    .results {
      display: none;
    }

    .results.active {
      display: block;
    }

    .result-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.1) 100%);
      pointer-events: none;
    }

    .result-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .result-value {
      font-size: 36px;
      font-weight: 700;
      position: relative;
    }

    .result-subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .dimensions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .dimension-item {
      background: #f7fafc;
      border-radius: 10px;
      padding: 14px;
      border: 2px solid #e2e8f0;
    }

    .dimension-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #718096;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .dimension-value {
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
    }

    .icon {
      display: inline-block;
      margin-right: 6px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #2d3748;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📐 Yüzde Hesaplama</h1>
    <p class="subtitle">Seçili öğenin boyut yüzdeleri</p>
    
    <div id="error" class="error-message" style="display: none;"></div>
    
    <div id="results" class="results">
      <div class="result-card">
        <div class="result-label"><span class="icon">↔️</span>Genişlik</div>
        <div class="result-value" id="widthPercent">%0.00</div>
        <div class="result-subtitle">Parent'a göre yüzde</div>
      </div>
      
      <div class="result-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="result-label"><span class="icon">↕️</span>Yükseklik</div>
        <div class="result-value" id="heightPercent">%0.00</div>
        <div class="result-subtitle">Parent'a göre yüzde</div>
      </div>

      <div class="dimensions">
        <div class="dimension-item">
          <div class="dimension-label">Öğe Genişlik</div>
          <div class="dimension-value" id="nodeWidth">0px</div>
        </div>
        <div class="dimension-item">
          <div class="dimension-label">Öğe Yükseklik</div>
          <div class="dimension-value" id="nodeHeight">0px</div>
        </div>
        <div class="dimension-item">
          <div class="dimension-label">Parent Genişlik</div>
          <div class="dimension-value" id="frameWidth">0px</div>
        </div>
        <div class="dimension-item">
          <div class="dimension-label">Parent Yükseklik</div>
          <div class="dimension-value" id="frameHeight">0px</div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" id="calculateBtn">🔄 Yeniden Hesapla</button>
        <button class="btn btn-secondary" id="closeBtn">✕ Kapat</button>
      </div>
    </div>
  </div>

  <script>
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      
      if (msg.type === 'error') {
        document.getElementById('error').textContent = msg.message;
        document.getElementById('error').style.display = 'block';
        document.getElementById('results').classList.remove('active');
      } else if (msg.type === 'result') {
        document.getElementById('error').style.display = 'none';
        document.getElementById('results').classList.add('active');
        
        document.getElementById('widthPercent').textContent = '%' + msg.widthPercent;
        document.getElementById('heightPercent').textContent = '%' + msg.heightPercent;
        document.getElementById('nodeWidth').textContent = msg.nodeWidth + 'px';
        document.getElementById('nodeHeight').textContent = msg.nodeHeight + 'px';
        document.getElementById('frameWidth').textContent = msg.frameWidth + 'px';
        document.getElementById('frameHeight').textContent = msg.frameHeight + 'px';
      }
    };

    // Buton event listener'ları
    document.getElementById('calculateBtn').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'calculate' } }, '*');
    };

    document.getElementById('closeBtn').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    };
  </script>
</body>
</html>
